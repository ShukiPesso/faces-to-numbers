<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="כלנית עולה">
  <title>כלנית עולה – פטלי כלנית נפרשים ככנפיים ועולים מתוך אפר</title>
  <!-- ash: two low grey petals at the root -->
  <g fill="#A8A6A2">
    <ellipse cx="60" cy="98" rx="6" ry="17" transform="rotate(-70 60 110)"/>
    <ellipse cx="60" cy="98" rx="6" ry="17" transform="rotate(70 60 110)"/>
  </g>
  <!-- the body lifting out of the ash -->
  <ellipse cx="60" cy="88" rx="7" ry="17" fill="#6E6E6E"/>
  <!-- wings: anemone petals fanned around one heart -->
  <g fill="#9E1B1B">
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(-104 60 70)"/>
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(-72 60 70)"/>
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(-40 60 70)"/>
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(40 60 70)"/>
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(72 60 70)"/>
    <ellipse cx="60" cy="44" rx="9" ry="26" transform="rotate(104 60 70)"/>
    <ellipse cx="60" cy="46" rx="8" ry="18"/>
  </g>
  <circle cx="60" cy="68" r="6" fill="#FBF6EC"/>
</svg>
