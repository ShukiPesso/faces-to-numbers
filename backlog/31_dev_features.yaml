- id: F-12
  title: "'Where am I' — on-device geolocation hook and nearby banner"
  agent: dev
  model: sonnet
  wave: 3
  size: M
  status: done
  depends_on: [F-01, F-03, F-07, F-04]
  owns:
    - src/hooks/useNearbyStation.ts
    - src/components/tour/NearbyBanner.tsx
