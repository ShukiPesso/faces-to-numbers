    - tests/component/NearbyBanner.test.tsx
  reads:
    - docs/02_ARCHITECTURE.md
    - design/components/tour.md
    - docs/04_TESTING_STRATEGY.md
  goal: "A visitor can tap 'איפה אני' and get a suggestion of the nearest verified station — computed only on the device, only after a tap."
  steps:
    - "useNearbyStation exactly per docs/02_ARCHITECTURE.md §6. locate(): if 'geolocation' is not in navigator → status unavailable; else status locating and call getCurrentPosition with { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 }; on success → { status: 'done', result: findNearbyStation({ lat, lng }, getStations()) }; on error code 1 → denied; any other error → unavailable. reset() returns to idle. Never call geolocation on mount."
    - "NearbyBanner: props state, onLocate. A button (data-testid where-am-i, label t('nearby.button')); the privacy line t('nearby.privacy'); an aria-live='polite' region (data-testid nearby-banner) whose text is: locating → t('nearby.locating'); at → t('nearby.at', { title }); near → t('nearby.near', { title, distance: formatDistance(m) }); none → t('nearby.none'); denied → t('nearby.denied'); unavailable → t('nearby.unavailable'). For at and near include a Link t('nearby.open') to the station."
    - "tests/unit/useNearbyStation.test.ts (jsdom, renderHook): success inside a radius, success far away, error code 1, error code 2, missing API; and the hook does not call geolocation on mount."
    - "tests/component/NearbyBanner.test.tsx: CT-NEARBY-01."
  dont:
    - "No watchPosition. Never store, log or send coordinates."
  acceptance:
    - "Hook tests and CT-NEARBY-01 pass."
  verify:
    - "npm test -- tests/unit/useNearbyStation.test.ts tests/component/NearbyBanner.test.tsx"
    - "npm run lint && npm run typecheck"

