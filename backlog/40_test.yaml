  verify:
    - "npm run build && (npm run preview &) && sleep 3 && LIVE_URL=http://localhost:4173 npx playwright test --project=smoke"

- id: T-11
  title: Test audit — coverage, gaps, flakiness
  agent: test
  model: fable
  wave: 6
  size: M
  status: todo
  depends_on: [T-01, T-02, T-03, T-04, T-05, T-06, T-07, T-08, T-09, T-10, F-19]
  owns:
    - review/T-11-test-audit.md
  reads:
    - docs/04_TESTING_STRATEGY.md
    - tests/
    - src/
    - reports/
  goal: "Before launch, an independent reviewer confirms that every test in the catalog exists, actually tests what it claims, and is stable."
  steps:
    - "Make a table of every ID in docs/04_TESTING_STRATEGY.md §4 (UT-*, CT-*, CI-*, E2E-*, LH-*) → file and test name that implements it, or MISSING. Use grep for the ID in tests/."
    - "Run npx vitest run --coverage; record the numbers for src/lib/** and src/components/** against the thresholds."
    - "Run the full Playwright suite 3 times (npx playwright test --repeat-each=1, three separate runs); list any test that failed at least once as FLAKY with its error."
    - "Mutation spot-check (on a throwaway local branch, never committed): (1) change wazeUrl to swap lat/lng; (2) remove the ContentWarningGate around oct7 in PersonPage; (3) add '!' to one he.ts value; (4) change one word in one person JSON; (5) call getCurrentPosition on mount in useNearbyStation. For each, record which test failed. A mutation that no test catches is a HIGH finding."
    - "Grep for test.skip, test.fixme, .only, waitForTimeout and report every hit."
    - "Write review/T-11-test-audit.md: summary verdict (READY / NOT READY), the catalog table, coverage, flaky list, mutation table, findings ranked HIGH/MEDIUM/LOW with the task ID that should fix each."
  dont:
    - "Do not fix tests or code yourself — report. Do not commit the mutation branch."
  acceptance:
    - "Report exists with all sections; every MISSING item or uncaught mutation has a named owner task."
  verify:
    - "test -f review/T-11-test-audit.md"
    - "npx vitest run --coverage"
    - "npx playwright test"
