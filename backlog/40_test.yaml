    - "E2E-SAFE-02 (@fixture, fixture-chrome): '/#/person/test-person-2' → warning-gate visible and the oct7 text not in the DOM; click warning-skip → still not visible; click warning-show → visible and focused region contains it. Reload → still visible (session gate)."
    - "E2E-SAFE-03: every <img> src (resolved) has the page origin or starts with 'data:'."
    - "E2E-SAFE-04: expectNoBannedWords(page) on every route."
    - "E2E-SAFE-05: every station of kind 'drive' (from stations.json) shows driver-warning."
    - "reading.spec.ts — E2E-READ-01: turn read-aloud-toggle on → computed font-size of the main body paragraph ≥ 22px; reload → still on; turn off → back below 22px."
