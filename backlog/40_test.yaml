- id: T-09
  title: Lighthouse CI — performance, accessibility, best practices (LH-01)
  agent: test
  model: haiku
  wave: 5
  size: S
  status: todo
  depends_on: [F-18, F-19, O-02]
  owns:
    - lighthouserc.json
    - .github/workflows/lighthouse.yml
  reads:
    - docs/04_TESTING_STRATEGY.md
    - docs/02_ARCHITECTURE.md
    - .github/workflows/ci.yml
  goal: "Every pull request to main is measured on a simulated mid-range phone, and drops below the budgets fail the build."
  context: |
    Lighthouse 12 removed the PWA category, so LH-02 (installable / offline) is covered by E2E-PWA-01 and
    E2E-OFF-02 in T-05, not here. Use @lhci/cli through npx (no new dependency in package.json).
  steps:
    - "lighthouserc.json: ci.collect.staticDistDir './dist'; url: index plus '#/station/<first slug>' and '#/person/<first id>' read from the real content (hard-code the three URLs in the file and add a comment line in the workflow saying where they come from); numberOfRuns 3; settings preset default mobile (do not set 'desktop')."
    - "ci.assert.assertions: categories:performance minScore 0.9, categories:accessibility 0.95, categories:best-practices 0.95 — all 'error'. upload.target 'temporary-public-storage' is NOT allowed (content stays private) → use 'filesystem' with outputDir '.lighthouseci'."
    - ".github/workflows/lighthouse.yml: on pull_request to main; Node 20; npm ci; npm run build; npx --yes @lhci/cli@0.14 autorun; upload .lighthouseci as an artifact."
  dont:
    - "Do not upload reports to public storage. Do not add a 'pwa' category assertion (it no longer exists)."
  acceptance:
    - "Running locally after a build passes all assertions, or the report lists exactly which metric failed and the task is returned to F-19."
  verify:
    - "npm run build && npx --yes @lhci/cli@0.14 autorun"

- id: T-10
  title: Post-deploy smoke tests against the live URL (E2E-SMOKE-01..03)
  agent: test
  model: haiku
  wave: 5
  size: S
  status: todo
  depends_on: [F-18, P0-03]
  owns:
    - tests/e2e/smoke.spec.ts
  reads:
    - docs/04_TESTING_STRATEGY.md
    - playwright.config.ts
  goal: "Within a minute of each deploy we know the live site opens, shows content and installs its service worker."
  steps:
    - "All tests tagged @smoke; they run only in the 'smoke' project whose baseURL is process.env.LIVE_URL. If LIVE_URL is not set the whole file is skipped with test.skip(!process.env.LIVE_URL, 'LIVE_URL not set') — this is the one approved skip."
    - "E2E-SMOKE-01: response of page.goto('/') has status 200; h1 visible; html dir rtl."
    - "E2E-SMOKE-02: open the tour, click the first station card → its h1 is visible."
    - "E2E-SMOKE-03: navigator.serviceWorker.ready resolves within 15 s; collect console messages of type 'error' during the whole file and expect none."
    - "Do not depend on any specific person or text; content changes must not break smoke tests."
  dont:
    - "No writes, no form posts — the smoke test must be safe to run against production at any time."
  acceptance:
