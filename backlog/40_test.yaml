# Test lane — integrity tests, end-to-end tests, Lighthouse, smoke, audit.
# Unit and component tests live inside the dev tasks that build the code (F-*).
# These tasks test the SYSTEM, and are written by a different agent than the code they test.

- id: T-01
  title: Content integrity — no drift, independent fidelity check, sources (CI-03, CI-04, CI-05)
  agent: test
  model: opus
  wave: 2
  size: M
  status: done
  depends_on: [F-02, P0-03]
  owns:
    - tests/integrity/drift.test.ts
    - tests/integrity/source-fidelity.test.ts
    - tests/integrity/sources.test.ts
  reads:
    - content-source/README.md
    - content-source/people/
    - content-source/stations/
    - content-source/tour.md
    - src/content/data/
    - contracts/content.schema.ts
    - docs/04_TESTING_STRATEGY.md
  goal: "Every word a visitor reads is proven to come verbatim from content-source/ — by code that shares nothing with the converter, so a bug in one is caught by the other."
  context: |
    This is the anti-hallucination safety net of the whole project (ADR-003). The converter (F-02) turns
    content-source/*.md into src/content/data/*.json. You write a SECOND, independent reader of the same
    Markdown and compare. You must NOT import anything from scripts/content/ — if you reuse the converter,
    the test proves nothing. Write your own small regex code, deliberately simple.
  steps:
    - "drift.test.ts (CI-03): run `npm run content:check` with child_process.execSync (cwd = repo root, timeout 60 s) and expect exit code 0. On failure include stdout/stderr in the assertion message so the reviewer sees which file drifted."
    - "source-fidelity.test.ts (CI-04): for every file in content-source/people/*.md, content-source/stations/*.md and content-source/tour.md: (1) strip the front matter (text between the first two lines that are exactly '---'); (2) split the rest on lines matching /^## .+ · (\\w+)\\s*$/ — your own regex, written here; (3) for each section, find the matching JSON object (person by file name → id; station by file name; tour.json) and the field with the same key."
    - "Comparison rules per section type (from content-source/README.md): text sections → normalize both sides (collapse all whitespace runs to one space, trim) and expect the JSON field to EQUAL the normalized Markdown body; bullet sections → each '- ' line (without '- ') equals the matching array item, same count and order; guideLevels → the three bullets with the leading '**…:** ' removed equal s30, m2, m5; quote/altQuote → text and by equal the two lines without '> „', '”', '> — '; sources → see sources.test.ts (skip here)."
    - "Also assert the reverse direction: every text field present in a JSON object has a section in its Markdown file (no field appears from nowhere). Fields generated by the converter (id, order, sourceFile, photo, consent, location, …) come from front matter — for those check only: front matter `name`, `title`, `subtitle` equal the JSON values exactly."
    - "Name each test after the file and key, e.g. `CI-04 people/04_roni-eshel.md · oct7`, so a failure points at one section."
    - "sources.test.ts (CI-05): for every Markdown file parse each line of the sources section as '- <title> — <url>' (split on the LAST ' — '); expect the set of URLs to equal the set of JSON `sources[].url` for that object, and titles to match. Then: every person JSON and station in stations.json has exactly one Markdown file whose name matches its sourceFile, and every Markdown file has exactly one JSON object."
    - "Add one deliberately broken in-memory case per test file (e.g. compare against a cloned JSON with one changed word) and assert your comparison function reports it — this proves the test can fail. Do not write to disk."
  dont:
    - "Do NOT import from scripts/content/ (the converter) or from src/content/loader.ts. Reading JSON files with fs + JSON.parse is fine; importing the zod schemas is fine."
    - "Do not edit content-source/ or src/content/data/ to make a test pass. A real mismatch is a finding: stop and report it."
  acceptance:
    - "CI-03, CI-04 and CI-05 pass on the real content."
    - "grep shows no import of scripts/content in tests/integrity/."
    - "Each file contains a negative self-check that proves the comparison can fail."
  verify:
    - "npx vitest run tests/integrity/drift.test.ts tests/integrity/source-fidelity.test.ts tests/integrity/sources.test.ts"
    - "! grep -rn \"scripts/content\" tests/integrity/"

- id: T-02
  title: Repository scans — photos, UI words, coordinates, string keys, RTL classes (CI-06..CI-10)
  agent: test
  model: sonnet
  wave: 3
  size: M
  status: todo
  depends_on: [F-06, F-07, D-07, P0-03]
  owns:
    - tests/integrity/repo-scans.test.ts
  reads:
    - docs/04_TESTING_STRATEGY.md
    - docs/03_CONVENTIONS.md
    - src/i18n/he.ts
    - tests/e2e/helpers/banned.ts
    - src/content/data/
  goal: "Static scans make the most important rules of the project impossible to break silently: no press photos, no exclamation or gamification words, no swapped coordinates, no missing strings, no left/right CSS."
  steps:
    - "Use a small recursive fs.readdirSync helper to list files (no new dependency); read with fs. Put each check in its own test named with its ID."
    - "CI-06: the string 'referenceUrl' does not occur in any file under src/components/ or src/pages/; and for every person JSON with photo.status 'cleared', the file public + photo.src exists."
    - "CI-07: import { he } from src/i18n/he.ts; no value contains '!' or an emoji (regex /\\p{Extended_Pictographic}/u) or any word from BANNED_UI_WORDS (import it from tests/e2e/helpers/banned.ts). Report every offending key, not only the first."
    - "CI-08: every non-null station location has 31.2 ≤ lat ≤ 31.7 and 34.3 ≤ lng ≤ 34.8 (catches swapped lat/lng)."
    - "CI-09: scan src/**/*.{ts,tsx} with /\\bt\\(\\s*['\"]([a-zA-Z0-9_.]+)['\"]/g; every captured key exists in he. Also list keys in he that are never used — print them as a console.warn, do not fail."
    - "CI-10: scan src/**/*.{ts,tsx,css} for physical-direction Tailwind classes: /\\b(ml|mr|pl|pr|left|right|border-l|border-r|rounded-l|rounded-r|text-left|text-right)-/ inside className strings or @apply. Fail with file:line list. (Logical classes ms-, me-, ps-, pe-, start-, end-, text-start, text-end are the correct ones.)"
    - "Negative self-check for each scan: run the same matcher function on a small inline bad string and expect it to report it."
  dont:
    - "Do not add exceptions to make a scan pass. A hit is a finding for the owner of that file — report it."
  acceptance:
    - "CI-06..CI-10 pass on the current repo, each with a negative self-check."
  verify:
    - "npx vitest run tests/integrity/repo-scans.test.ts"

- id: T-03
  title: End-to-end — navigation, deep links, progress (E2E-NAV-01..03)
  agent: test
  model: sonnet
  wave: 5
  size: M
  status: todo
  depends_on: [F-13, F-14, F-15, F-16, F-17, P0-03]
  owns:
    - tests/e2e/navigation.spec.ts
  reads:
    - docs/04_TESTING_STRATEGY.md
    - docs/02_ARCHITECTURE.md
    - tests/e2e/helpers/
    - src/content/data/
    - contracts/strings.he.ts
  goal: "A visitor can walk the whole tour in order on phone, tablet and desktop, open any page by link, and pick up where they stopped."
  steps:
    - "Build expectations from the real content JSON (read with fs in the spec or via helpers/routes.ts) — never hard-code names or counts."
    - "E2E-NAV-01: '/' → click start-tour → '/tour' → open the first station → loop: assert h1 equals the station title and document.title contains it; for each primary person of the station open person-card-<id> and assert the person h1 equals the name, go back; click next-station until there is none; the last page is the last station. Use getByTestId and getByRole only."
    - "E2E-NAV-02: page.goto('/#/station/<slug>') for every station and '/#/person/<id>' for every person → correct h1 without visiting '/' first. '/#/station/nope' and '/#/person/nope' → NotFound with a link that goes to '/'."
    - "E2E-NAV-03: open the third station, click mark-visited, reload; go to '/' → resume-tour is visible and goes to the fourth station; click reset-progress → resume-tour disappears."
  dont:
    - "No waitForTimeout. No CSS selectors except [data-testid] via getByTestId."
  acceptance:
    - "All three tests pass in mobile-chrome, mobile-safari, tablet and desktop."
  verify:
    - "npx playwright test tests/e2e/navigation.spec.ts --project=mobile-chrome --project=mobile-safari --project=tablet --project=desktop"

- id: T-04
  title: End-to-end — geolocation and navigation links on fixture content (E2E-GEO-01..05, E2E-LINK-01)
  agent: test
  model: sonnet
  wave: 5
  size: M
  status: todo
  depends_on: [F-12, F-14, F-15, F-03, P0-03]
  owns:
    - tests/e2e/geolocation.spec.ts
  reads:
    - docs/04_TESTING_STRATEGY.md
    - tests/e2e/helpers/geo.ts
    - src/content/fixtures/
    - docs/02_ARCHITECTURE.md
  goal: "Location is only ever read when the visitor asks, the answer is correct for at / near / far / denied, and navigation links point to exactly the verified coordinates."
  context: |
    All tests here run on the FIXTURE build (fictional stations test-a/b/c with known coordinates), tag @fixture,
    project fixture-chrome. Real stations may still have location null, so real content cannot be used for this.
  steps:
    - "E2E-GEO-01: grantGeo(context, FIXTURE_POINTS.atA) → '/#/tour' → click where-am-i → nearby-banner contains the test-a title (compute the expected text from the strings contract 'nearby.at' with {title}) and its link opens '/#/station/test-a'."
    - "E2E-GEO-02: nearB → banner says near test-b and contains a distance text (a number followed by מטר or ק״מ)."
    - "E2E-GEO-03: far → banner shows the 'nearby.none' string."
    - "E2E-GEO-04: denyGeo(context) → banner shows the denied string; the station list is still visible and clickable."
    - "E2E-GEO-05: spyGeolocation(page) before navigation; visit every fixture route (/, /tour, each station, each person, /about, /sources) and assert getCurrentPosition was called 0 times."
    - "E2E-LINK-01: '/#/station/test-a' → nav-waze href equals exactly 'https://waze.com/ul?ll=31.400000,34.500000&navigate=yes' and nav-google href equals 'https://www.google.com/maps/dir/?api=1&destination=31.400000,34.500000'; '/#/station/test-c' → location-unverified visible and no nav-waze / nav-google."
    - "Title every test with its ID and '@fixture'."
  dont:
    - "Never call real geolocation; always use the helpers."
  acceptance:
    - "All six tests pass in fixture-chrome."
  verify:
    - "npx playwright test tests/e2e/geolocation.spec.ts --project=fixture-chrome"

- id: T-05
  title: End-to-end — offline and installable PWA (E2E-OFF-01..02, E2E-PWA-01)
  agent: test
  model: opus
  wave: 5
  size: M
  status: todo
  depends_on: [F-18, T-03, P0-03]
  owns:
    - tests/e2e/offline.spec.ts
    - tests/e2e/pwa.spec.ts
  reads:
    - docs/04_TESTING_STRATEGY.md
    - tests/e2e/helpers/offline.ts
    - tests/e2e/helpers/routes.ts
    - vite.config.ts
    - docs/02_ARCHITECTURE.md
  goal: "Once the site was opened with reception, the whole tour works with no reception at all — the core promise for a car driving along the Gaza border."
  context: |
    Service workers only work in Chromium projects in Playwright; tag these tests @sw. Use the production
    preview build (npm run build && npm run preview), never the dev server — vite-plugin-pwa does not
    register a service worker in dev by default.
  steps:
    - "E2E-OFF-01 (@sw, mobile-chrome and desktop): goto '/' → waitForServiceWorker(page) → wait until navigator.serviceWorker.controller is set (reload once if needed) → goOffline(context) → for every route in allRoutes(): navigate with the in-app links or page.goto, assert the h1 is visible and the main content is not empty; offline-indicator visible. goOnline at the end."
    - "E2E-OFF-02 (@sw, mobile-chrome): after the SW is controlling → goOffline → page.reload() → the app shell and a station page load from cache."
    - "E2E-PWA-01 (@sw, mobile-chrome): fetch the manifest linked from <link rel=manifest>; assert name and short_name non-empty, lang 'he', dir 'rtl', display 'standalone', start_url present, icons include 192×192 and 512×512 and one with purpose containing 'maskable'; navigator.serviceWorker.getRegistration() is defined."
    - "If a route fails offline, report which asset was missing (use page.on('requestfailed') to list URLs)."
  dont:
    - "Do not change vite.config.ts or the precache list — that is F-18's file. Report the missing asset instead."
  acceptance:
    - "All three tests pass on their projects; when F-18's precache is broken (e.g. a route chunk not precached) E2E-OFF-01 fails with the URL of the missing file."
  verify:
    - "npx playwright test tests/e2e/offline.spec.ts tests/e2e/pwa.spec.ts --project=mobile-chrome --project=desktop"

