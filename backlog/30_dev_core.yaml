    - "Markdown: react-markdown WITHOUT rehype-raw; component overrides for p, strong, ul, ol, li, a (external links get target _blank, rel 'noopener noreferrer' and a visually hidden t('common.externalLink')); the wrapper element has the attribute data-inline-text."
