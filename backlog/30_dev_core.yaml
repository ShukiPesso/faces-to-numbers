    - design/icons.md
    - docs/02_ARCHITECTURE.md
    - docs/04_TESTING_STRATEGY.md
    - src/content/schema.ts
    - src/i18n/he.ts
  goal: "Button, SectionHeading, DurationBadge, Markdown, QuoteBlock, PhotoFrame, SourceList and ShareButton exist per spec with component tests."
  steps:
